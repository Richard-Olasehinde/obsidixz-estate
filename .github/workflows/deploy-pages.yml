name: Deploy to GitHub Pages

# WHY GITHUB PAGES
# ----------------
# This site is *fully static*: `next build` marks all 13 routes as prerendered,
# there is no API route, no server action and no database. That is a direct
# consequence of moving contact to the visitor's own email application.
#
# THE BASE PATH QUESTION — AND WHY IT WAS WRONG BEFORE
# ----------------------------------------------------
# A GitHub Pages *project* site is served from https://<user>.github.io/<repo>/
# — a sub-directory. Build for that and every asset URL needs the /<repo>
# prefix, or the HTML returns 200 while all CSS, JS and images 404.
#
# But this site is published on a **custom domain**, and GitHub's own behaviour
# is that a custom domain serves the site at the *root*. A build carrying
# /<repo> prefixes therefore breaks on the domain instead — the opposite
# failure, in the place that actually matters.
#
# An earlier revision of this workflow hardcoded the prefix. That was correct
# for the github.io preview URL and wrong for the live domain. Since the custom
# domain is the destination, the build now sets **no** base path, and the guard
# below fails the run if a prefix ever reappears.
#
# Consequence, stated plainly: the bare github.io/<repo>/ URL is NOT a usable
# preview for this build and will render unstyled. Preview on the custom domain
# once the certificate is issued. This is a deliberate trade, not an oversight.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://realestate.obsidixz.pp.ua
      # NEXT_PUBLIC_BASE_PATH is deliberately UNSET. next.config.ts omits
      # basePath and assetPrefix entirely when it is empty, which is what a
      # custom-domain deployment needs.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck, lint, layout, accessibility, copy feedback
        run: npm run check

      - name: Build a true static export
        env:
          NEXT_OUTPUT_EXPORT: '1'
        run: npm run build

      - name: Verify no base path leaked into the output
        run: |
          # Guards the failure described at the top: asset URLs must be root-
          # absolute (/ _next/...) so they resolve on a custom domain. If a
          # /<repo>/ prefix ever reappears, the page would load with no styling
          # on the live domain — a failure that returns HTTP 200 and so cannot
          # be caught by a status check.
          # The export must contain index.html at its ROOT. `next build` alone
          # puts it in .next/server/app/, which only the Next server can serve;
          # uploading that to Pages 404s every URL. This asserts the difference.
          test -f out/index.html || {
            echo "::error::out/index.html is missing. The build did not produce a static export."
            exit 1
          }
          if grep -qE '"/(obsidixz-estate|apps)/_next/' out/index.html; then
            echo "::error::Asset URLs carry a repository prefix. On a custom domain they must be root-absolute."
            exit 1
          fi
          grep -q '"/_next/' out/index.html
          echo "Static export is root-absolute with index.html at the root. Correct for a custom domain."

      - name: Add .nojekyll and CNAME
        run: |
          # Jekyll ignores files and directories beginning with an underscore.
          # Next.js puts every asset under /_next/, so without this file the
          # entire stylesheet and JavaScript bundle would be skipped.
          touch out/.nojekyll

          # GitHub Pages reads CNAME from the *published output* to bind the
          # custom domain. GitHub also writes one into the branch automatically
          # when the domain is saved in Settings — but that is branch-based and
          # does not apply to an Actions artifact build, so it is written here.
          # Without it the deployment can serve the custom domain with 404s on
          # every asset path while the github.io URL works.
          echo 'realestate.obsidixz.pp.ua' > out/CNAME
          cat out/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The static export, not the server build. See the note at the top.
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
